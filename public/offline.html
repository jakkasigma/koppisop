<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KopiSop Kasir - Offline</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: radial-gradient(circle at 20% 0, #ede0ca, #f2ebdf);
            color: #1f2937;
        }
        .card {
            width: min(92vw, 420px);
            background: #fffcf6;
            border: 1px solid #e7d8c0;
            border-radius: 16px;
            padding: 18px;
            text-align: center;
        }
        h1 { margin: 0 0 8px; font-size: 24px; }
        p { margin: 0 0 14px; color: #6b7280; }
        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            border: 1px solid #0b6e68;
            background: #0b6e68;
            color: #fff;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Kamu sedang offline</h1>
    <p>Koneksi internet terputus. Coba nyalakan jaringan lalu muat ulang halaman.</p>
    <a href="/">Coba Lagi</a>
</div>
</body>
</html>
